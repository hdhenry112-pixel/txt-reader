<!doctype html>
<html lang="zh-CN" data-theme="day">
<head>
  <meta charset="utf-8">
  <title>阅读</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="阅读">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/shelf.css">
  <link rel="stylesheet" href="css/reader.css">
</head>
<body>
  <main id="view-shelf" class="view">
    <header class="topbar">
      <h1>书架</h1>
      <label class="import-button">
        导入
        <!-- 故意不写 accept：写了以后 iOS 文件选择界面里 Google Drive 位置显示 Content Unavailable。
             文件类型改为选完之后在 importer.js 里按扩展名检查。见 spec ⑧ C2。 -->
        <input id="import-input" class="visually-hidden" type="file" multiple>
      </label>
    </header>
    <p id="import-status" class="import-status" role="status" hidden></p>
    <section id="shelf-list" class="shelf-list" aria-label="书架"></section>
    <p id="shelf-empty" class="shelf-empty">还没有书</p>
    <footer class="shelf-footer">版本 <span id="app-version">…</span></footer>
  </main>

  <main id="view-reader" class="view reader" hidden>
    <header id="reader-top" class="reader-bar reader-top" hidden>
      <button id="reader-back" type="button">‹ 书架</button>
      <span id="reader-book-title" class="grow"></span>
    </header>

    <div id="reader-scroll" class="reader-scroll">
      <article id="reader-content" class="reader-content"></article>
    </div>

    <footer id="reader-bottom" class="reader-bar reader-bottom" hidden>
      <button id="reader-toc-button" type="button">目录</button>
      <span id="reader-chapter-title" class="grow"></span>
      <span id="reader-percent"></span>
    </footer>

    <aside id="toc-panel" class="toc-panel" aria-label="目录" hidden>
      <div class="toc-header">
        <h2>目录</h2>
        <button id="toc-close" type="button">关闭</button>
      </div>
      <ol id="toc-list" class="toc-list"></ol>
    </aside>
  </main>

  <div id="toast-host" class="toast-host" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
