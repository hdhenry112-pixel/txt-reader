<!doctype html>
<html lang="zh-CN" data-theme="day">
<head>
  <meta charset="utf-8">
  <title>阅读</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="阅读">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <meta name="theme-color" content="#F2F1EC">
  <script src="js/theme-boot.js"></script>
  <script src="js/lock-boot.js"></script>
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/shelf.css">
  <link rel="stylesheet" href="css/reader.css">
</head>
<body>
  <main id="view-shelf" class="view">
    <header class="topbar">
      <h1>书架</h1>
      <div class="topbar-actions">
        <button id="more-button" class="ghost-button" type="button">更多</button>
        <label class="import-button">
        导入
        <!-- 故意不写 accept：写了以后 iOS 文件选择界面里 Google Drive 位置显示 Content Unavailable。
             文件类型改为选完之后在 importer.js 里按扩展名检查。见 spec ⑧ C2。 -->
        <input id="import-input" class="visually-hidden" type="file" multiple>
      </label>
      </div>
    </header>
    <p id="import-status" class="import-status" role="status" hidden></p>
    <p id="pending-notice" class="pending-notice" role="status" hidden></p>
    <!-- 「换编码重新导入」时用来重新选原文件。同样不写 accept。 -->
    <input id="reimport-input" class="visually-hidden" type="file">
    <section id="shelf-list" class="shelf-list" aria-label="书架"></section>
    <!-- 默认隐藏：书架读完之后确认没有书才显示，免得有书的人每次启动先看到一眼「还没有书」。 -->
    <p id="shelf-empty" class="shelf-empty" hidden>还没有书</p>
    <footer class="shelf-footer">版本 <span id="app-version">…</span></footer>
  </main>

  <main id="view-reader" class="view reader" hidden>
    <header id="reader-top" class="reader-bar reader-top" hidden>
      <button id="reader-back" type="button">‹ 书架</button>
      <span id="reader-book-title" class="grow"></span>
    </header>

    <div id="reader-scroll" class="reader-scroll">
      <article id="reader-content" class="reader-content"></article>
    </div>

    <footer id="reader-bottom" class="reader-bar reader-bottom" hidden>
      <button id="reader-toc-button" type="button">目录</button>
      <span id="reader-chapter-title" class="grow"></span>
      <span id="reader-percent"></span>
      <button id="reader-settings-button" type="button">设置</button>
    </footer>

    <aside id="settings-panel" class="settings-panel" aria-label="设置" hidden>
      <div class="setting-row">
        <span class="setting-label">模式</span>
        <div class="setting-choices">
          <button type="button" data-set="mode" data-value="page">翻页</button>
          <button type="button" data-set="mode" data-value="scroll">滚动</button>
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-label">字号</span>
        <div class="setting-stepper">
          <button type="button" data-step="fontSize" data-dir="-1" aria-label="减小字号">−</button>
          <span id="setting-fontSize"></span>
          <button type="button" data-step="fontSize" data-dir="1" aria-label="增大字号">+</button>
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-label">行距</span>
        <div class="setting-stepper">
          <button type="button" data-step="lineHeight" data-dir="-1" aria-label="减小行距">−</button>
          <span id="setting-lineHeight"></span>
          <button type="button" data-step="lineHeight" data-dir="1" aria-label="增大行距">+</button>
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-label">页边距</span>
        <div class="setting-stepper">
          <button type="button" data-step="margin" data-dir="-1" aria-label="减小页边距">−</button>
          <span id="setting-margin"></span>
          <button type="button" data-step="margin" data-dir="1" aria-label="增大页边距">+</button>
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-label">主题</span>
        <div class="setting-choices">
          <button type="button" data-set="theme" data-value="day">白天</button>
          <button type="button" data-set="theme" data-value="sepia">护眼</button>
          <button type="button" data-set="theme" data-value="night">夜间</button>
        </div>
      </div>
    </aside>

    <aside id="toc-panel" class="toc-panel" aria-label="目录" hidden>
      <div class="toc-header">
        <h2>目录</h2>
        <button id="toc-close" type="button">关闭</button>
      </div>
      <ol id="toc-list" class="toc-list"></ol>
    </aside>
  </main>

  <div id="backup-panel" class="dialog-backdrop" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-label="更多">
      <h2>更多</h2>

      <h3>导出</h3>
      <p>导出书架、阅读进度和设置。</p>
      <label class="check-row">
        <input id="backup-include-text" type="checkbox">
        <span>包含书的正文</span>
        <span id="backup-size" class="check-row-note"></span>
      </label>
      <div class="dialog-buttons">
        <button id="backup-build" type="button" data-kind="primary">生成备份</button>
      </div>
      <div id="backup-ready" hidden>
        <p id="backup-ready-text"></p>
        <div class="dialog-buttons">
          <button id="backup-save" type="button" data-kind="primary">保存到文件</button>
        </div>
      </div>

      <h3>恢复</h3>
      <p>从备份文件恢复。书架上已有的书不会被删除。</p>
      <div class="dialog-buttons">
        <!-- 同样不写 accept，原因见上面的导入按钮。 -->
        <label class="file-button">
          选择备份文件
          <input id="restore-input" class="visually-hidden" type="file">
        </label>
      </div>

      <h3>手势密码</h3>
      <p id="lock-status"></p>
      <div class="dialog-buttons">
        <button id="lock-enable" type="button">开启</button>
        <button id="lock-change" type="button" hidden>修改</button>
        <button id="lock-disable" type="button" hidden>关闭密码</button>
      </div>

      <div class="dialog-buttons">
        <button id="backup-close" type="button">关闭</button>
      </div>
    </div>
  </div>

  <!-- 设置手势密码时画图案的页面。 -->
  <div id="pattern-sheet" class="pattern-screen" role="dialog" aria-modal="true" aria-label="设置手势密码" hidden>
    <h2 id="sheet-title" class="pattern-title"></h2>
    <p id="sheet-hint" class="pattern-hint" role="status"></p>
    <div id="sheet-pad" class="pattern-host"></div>
    <button id="sheet-cancel" class="pattern-link" type="button">取消</button>
  </div>

  <!-- 锁屏页。上锁期间 <html data-locked="1">，除它和 .over-lock 的弹层以外的内容都被隐藏。 -->
  <div id="lock-screen" class="pattern-screen" role="dialog" aria-modal="true" aria-label="解锁" hidden>
    <h2 class="pattern-title">画图案解锁</h2>
    <p id="lock-hint" class="pattern-hint" role="status"></p>
    <div id="lock-pad" class="pattern-host"></div>
    <button id="lock-forget" class="pattern-link" type="button">忘记图案</button>
  </div>

  <div id="toast-host" class="toast-host" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
