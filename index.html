<!doctype html>
<html lang="zh-CN" data-theme="day">
<head>
  <meta charset="utf-8">
  <title>阅读</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="阅读">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/shelf.css">
</head>
<body>
  <main id="view-shelf" class="view">
    <header class="topbar">
      <h1>书架</h1>
      <label class="import-button">
        导入
        <input id="import-input" class="visually-hidden" type="file" accept=".txt,text/plain" multiple>
      </label>
    </header>
    <p id="import-status" class="import-status" role="status" hidden></p>
    <section id="shelf-list" class="shelf-list" aria-label="书架"></section>
    <p id="shelf-empty" class="shelf-empty">还没有书</p>
    <footer class="shelf-footer">版本 <span id="app-version">…</span></footer>
  </main>

  <div id="toast-host" class="toast-host" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
